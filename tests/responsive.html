<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STARWAKE responsive review</title>
<style>body{margin:20px;background:#18242b;color:#cce2d8;font:14px sans-serif}button,select{margin:0 8px 10px 0;padding:10px;background:#273b40;color:inherit;border:1px solid #688c82}iframe{display:block;border:1px solid #83968b;width:390px;height:844px}p{font:12px monospace}</style>
<select id="game" aria-label="確認する画面"><option value="../">入口</option><option value="../vertical/">ZENITH 縦型</option><option value="../horizontal/">HORIZON 横型</option></select>
<button data-w="390" data-h="844">スマホ縦</button><button data-w="844" data-h="390">スマホ横</button><button data-w="820" data-h="1180">iPad縦</button><button data-w="1180" data-h="820">iPad横</button><button data-w="1440" data-h="900">PC</button><p id="size">390 × 844</p><iframe src="../" title="STARWAKE device preview" allow="fullscreen"></iframe>
<script>const frame=document.querySelector('iframe');document.querySelector('#game').onchange=e=>frame.src=e.target.value;for(const button of document.querySelectorAll('button'))button.onclick=()=>{frame.style.width=button.dataset.w+'px';frame.style.height=button.dataset.h+'px';document.querySelector('#size').textContent=button.dataset.w+' × '+button.dataset.h;};</script></html>
