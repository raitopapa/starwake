<!doctype html><html lang="ja"><meta charset="utf-8"><title>STARWAKE layout check</title><style>body{margin:20px;background:#343a40;color:white;font:14px sans-serif}button{margin:0 10px 15px 0;padding:12px}iframe{display:block;border:1px solid #83968b;width:390px;height:844px}p{color:#bbcaca}</style><button data-w="390" data-h="844">スマホ縦 390 × 844</button><button data-w="844" data-h="390">スマホ横 844 × 390</button><button data-w="820" data-h="1180">iPad縦 820 × 1180</button><button data-w="1180" data-h="820">iPad横 1180 × 820</button><p id="size">390 × 844 / actual CSS viewport inside iframe</p><iframe src="../" title="STARWAKE device preview"></iframe><script>for(const b of document.querySelectorAll('button'))b.onclick=()=>{const f=document.querySelector('iframe');f.style.width=b.dataset.w+'px';f.style.height=b.dataset.h+'px';document.querySelector('#size').textContent=b.dataset.w+' × '+b.dataset.h;};</script></html>
